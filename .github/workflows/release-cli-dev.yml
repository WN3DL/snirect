name: Release CLI

on:
  push:
    branches:
      - dev          # 允许在 dev 分支推送触发测试编译
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upx:
        description: "UPX 压缩发布二进制（默认关）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # 注意：跳过了原版的 make test，因为旧测试包含对已删除硬编码规则的断言

      - name: Install UPX
        if: inputs.upx == true
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      # 原汁原味调用 Makefile 编译全部平台
      - name: Build CLI binaries
        run: make release-cli UPX=${{ inputs.upx && '1' || '0' }}

      # 针对 Windows，将 rules.json 和可执行文件打成便携 zip 压缩包
      - name: Package Windows portable zip
        run: |
          cp rules.json dist/
          (cd dist && zip snirect-windows-amd64.zip snirect-windows-amd64.exe rules.json)
          (cd dist && zip snirect-windows-arm64.zip snirect-windows-arm64.exe rules.json)

      # 原汁原味调用 Makefile 生成校验和
      - name: Generate Checksums
        run: make checksum

      # 上传产物（即使没有打 release tag，也可以直接在 Actions 运行页面下载）
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snirect-build
          path: dist/*
