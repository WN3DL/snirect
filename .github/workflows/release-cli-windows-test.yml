name: Release CLI (Windows Portable)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # Allows manual one-click build anytime on GitHub Web UI

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Windows Binaries and Package
        run: |
          mkdir -p release_assets

          # 1. Build Windows amd64 (x86_64)
          mkdir -p build_amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o build_amd64/snirect.exe ./cmd/snirect
          cp rules.json build_amd64/
          (cd build_amd64 && zip -r ../release_assets/snirect-windows-amd64.zip snirect.exe rules.json)

          # 2. Build Windows arm64
          mkdir -p build_arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o build_arm64/snirect.exe ./cmd/snirect
          cp rules.json build_arm64/
          (cd build_arm64 && zip -r ../release_assets/snirect-windows-arm64.zip snirect.exe rules.json)

          # 3. Generate SHA-256 Checksums
          cd release_assets
          sha256sum *.zip > checksums.txt

      - name: Upload Artifacts (For Manual Runs)
        uses: actions/upload-artifact@v4
        with:
          name: snirect-windows-portable
          path: release_assets/*

      - name: Create GitHub Release (For Tagged Releases)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}