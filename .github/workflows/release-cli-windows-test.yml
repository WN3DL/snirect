name: Release CLI (Windows Portable)

on:
  push:
    branches:
      - dev          # 提交到 dev 分支自动触发编译
    tags:
      - "v*"         # 推送发布标签触发
  workflow_dispatch: # 支持在 GitHub 网页上手动点击按钮触发

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Windows Binaries and Package
        run: |
          mkdir -p release_assets

          # 从原版脚本获取版本号，若无 tag 则为 0.0.0-dev
          VERSION=$(bash scripts/git_version.sh 'v*' 2>/dev/null || echo "0.0.0-dev")
          LDFLAGS="-s -w -X github.com/xihale/snirect/internal/cli.Version=${VERSION}"

          # 1. 编译 Windows amd64 (x86_64) - 入口指定为 ./cmd/snirect
          mkdir -p build_amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o build_amd64/snirect.exe ./cmd/snirect
          cp rules.json build_amd64/
          (cd build_amd64 && zip -r ../release_assets/snirect-windows-amd64.zip snirect.exe rules.json)

          # 2. 编译 Windows arm64 - 入口指定为 ./cmd/snirect
          mkdir -p build_arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o build_arm64/snirect.exe ./cmd/snirect
          cp rules.json build_arm64/
          (cd build_arm64 && zip -r ../release_assets/snirect-windows-arm64.zip snirect.exe rules.json)

          # 3. 生成 SHA-256 校验和文件
          cd release_assets
          sha256sum *.zip > checksums.txt

      - name: Upload Artifacts (For Branch / Manual Runs)
        uses: actions/upload-artifact@v4
        with:
          name: snirect-windows-portable
          path: release_assets/*

      - name: Create GitHub Release (For Tagged Releases)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
